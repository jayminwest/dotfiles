# Flick config, shared by every Mac: all keybindings and actions live here, so
# every desktop behaves the same. Edit, then run "Reload Flick Config" from Flick.
# A Mac's own endpoints ([[llm.servers]], [remote], [kota], [[sys.machine]],
# [[sys.service]], its own quicklinks) go in ~/.config/flick/config.<LocalHostName
# lowercase>.toml, linked from the private overlay and merged over this file: tables
# merge key by key; arrays and [[...]] lists replace this file's.

# Modifiers: cmd, alt, ctrl, shift. Keys: Space, KeyA..KeyZ, Digit0..Digit9, F1..F12, ...
hotkey = "ctrl+space"

# Jump between the WezTerm desktop and the everything-else desktop: switches
# to the most recent app on another desktop. Replaces macOS's cmd+` window cycling.
desktop_toggle = "cmd+Backquote"

# Window switcher: fuzzy-search open windows; the first result is the previous window.
windows_hotkey = "cmd+Space"

# Hold-to-cycle window switcher: replaces macOS cmd+Tab (shift+Tab goes back, release
# cmd to switch).
[switcher]
cycle_hotkey = "cmd+Tab"

[activity]
urls = true

# Vim-style window keys on Hyper (Caps Lock via [keys] hyper = cmd+ctrl+alt+shift),
# so cmd+H/J/K/L keep working in apps (cmd+L = Brave address bar). Repeating a
# half cycles 1/2 -> 2/3 -> 1/3.
# Off while trying AeroSpace (home/.config/aerospace), which owns Hyper+H/J/K/L/N/P
# and Hyper+arrows. Uncomment to go back.
# [window_keys]
# left-half = "cmd+ctrl+alt+shift+KeyH"
# right-half = "cmd+ctrl+alt+shift+KeyL"
# maximize = "cmd+ctrl+alt+shift+KeyK"
# hide = "cmd+ctrl+alt+shift+KeyJ"
# next-display = "cmd+ctrl+alt+shift+KeyN"
# previous-display = "cmd+ctrl+alt+shift+KeyP"
# Hyper+arrows: move the window to the screen that way (Hyper already holds shift,
# so Hyper+shift+H/J/K/L would be Hyper+H/J/K/L above).
# display-left = "cmd+ctrl+alt+shift+ArrowLeft"
# display-below = "cmd+ctrl+alt+shift+ArrowDown"
# display-above = "cmd+ctrl+alt+shift+ArrowUp"
# display-right = "cmd+ctrl+alt+shift+ArrowRight"

# Caps Lock is Hyper (cmd+ctrl+alt+shift); a quick tap is Escape. Replaces Hyperkey.
[keys]
hyper = "caps_lock"
hyper_tap = "Escape"
hyper_tap_ms = 300

[launcher]
opacity = 0.98

# Quicklinks open a URL or a path. "{query}" makes the link take an argument.
# Typing "<keyword> <text>" runs a link straight from the root search.
[[quicklinks]]
name = "GitHub Search"
keyword = "gh"
url = "https://github.com/search?q={query}&type=repositories"

[[quicklinks]]
name = "YouTube"
keyword = "yt"
url = "https://www.youtube.com/results?search_query={query}"

[[quicklinks]]
name = "Projects"
url = "~/Projects"

[[quicklinks]]
name = "Search Google"
keyword = "g"
url = "https://google.com/search?q={query}"

[[quicklinks]]
name = "search"
keyword = "d"
url = "https://duckduckgo.com/?q={query}"

[[quicklinks]]
name = "3000"
url = "http://localhost:3000/"

[[quicklink.links]]
name = "flickgh"
url = "https://github.com/jayminwest/flick"

# Message cards (docs/message.md in jayminwest/flick): a corner card that
# does not take focus. Older Flick builds ignore this table.
[message]
position = "top-right"
timeout_secs = 30

# Type today's date (YYYY-MM-DD) into the front app: Hyper+D, or "Today's Date" in search.
[[snippet.texts]]
name = "Today's Date"
text = "{date}"
hotkey = "cmd+ctrl+alt+shift+KeyD"

# Dictation: hold right_cmd+right_shift, speak, release. whisper-cpp and sox come from
# modules/darwin-desktop.nix; the model is a manual download (docs/dictation.md in flick).
[dictation]
engine = "whisper"
model = "~/Library/Application Support/Flick/models/ggml-large-v3-turbo-q5_0.bin"

# Chords. A Mac's overlay that sets [[keys.chord]] replaces this whole list, so
# keep every chord here.
[[keys.chord]]
name = "dictate"
keys = ["right_cmd", "right_shift"]
on_down = { flick = "dictation start" }
on_up = { flick = "dictation stop" }

# fn+Space: Homerow hints. Homerow's shortcut recorder can't take fn, so this sends the
# shortcut set in Homerow, Hyper+G (its default cmd+shift+Space is 1Password's).
[[keys.chord]]
name = "homerow"
keys = ["fn", "Space"]
on_down = { shell = "osascript -e 'tell application \"System Events\" to keystroke \"g\" using {command down, control down, option down, shift down}'" }

# Local model chat. The servers ([[llm.servers]]) are per Mac, in its overlay;
# "private" is the no-log one.
[llm]
hotkey = "cmd+ctrl+alt+shift+KeyM"
private_hotkey = "cmd+ctrl+alt+shift+KeyV"

# herdr agent notifications: every status Flick can notify on.
[herdr]
notify = ["blocked", "done"]

# AeroSpace: "AeroSpace Keys" (Hyper+/) is the cheatsheet, read from the header comment of
# home/.config/aerospace/aerospace.toml; "AeroSpace Windows" (Hyper+W) lists every window
# by workspace, Enter focuses it.
[[ext.extensions]]
name = "aerospace"
argv = ["~/.dotfiles/home/.config/aerospace/flick-aerospace"]
hotkeys = { keys = "cmd+ctrl+alt+shift+Slash", windows = "cmd+ctrl+alt+shift+KeyW" }
